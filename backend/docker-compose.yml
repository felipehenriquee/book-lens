# Stack completa do backend:
#   api    — FastAPI (upload, consulta, SSE)
#   worker — Celery: processa a fila de scans (escala com --scale worker=N)
#   beat   — Celery beat: tarefas agendadas (reconciliador, limpeza). UMA instância só!
#   db     — MariaDB: fonte da verdade (estado dos scans, livros, usuários)
#   redis  — pub/sub do SSE, tokens, rate limits, vagas por usuário
#   rabbitmq — broker do Celery (painel em http://localhost:15672)
#
#   docker compose up --build
#   docker compose up --scale worker=3     # mais workers
#
# Os endereços abaixo sobrescrevem os do .env (que apontam para localhost no
# desenvolvimento fora do Docker).
x-backend: &backend
  build: .
  env_file:
    - .env
  environment:
    DATABASE_URL: mysql+asyncmy://booklens:booklens@db:3306/booklens
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: amqp://booklens:booklens@rabbitmq:5672//
  volumes:
    - ./app:/code/app
    - ./main.py:/code/main.py
    # Fotos da fila: compartilhadas entre a API (que grava) e os workers (que leem).
    # Workers em OUTRAS máquinas exigiriam um storage compartilhado (ex.: S3).
    - ./storage:/code/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  api:
    <<: *backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 3
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO

  beat:
    <<: *backend
    command: celery -A app.worker.celery_app beat --loglevel=INFO

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: booklens
      MARIADB_USER: booklens
      MARIADB_PASSWORD: booklens
      MARIADB_ROOT_PASSWORD: booklens_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: booklens-rabbitmq  # o RabbitMQ guarda os dados por nome de nó
    environment:
      RABBITMQ_DEFAULT_USER: booklens
      RABBITMQ_DEFAULT_PASS: booklens
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
