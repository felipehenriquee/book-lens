<a [routerLink]="['/app/books', book.id]" class="card-surface flex gap-4 cursor-pointer">
  <img
    [src]="book.coverUrl || 'https://placehold.co/80x120?text=Sem+Capa'"
    [alt]="book.title"
    class="w-[40%] aspect-[2/3] object-cover rounded-md flex-shrink-0"
  />

  <div class="flex-1 min-w-0">
    <h3 class="font-semibold text-gray-900 truncate">{{ book.title }}</h3>
    <p class="text-sm text-gray-500 truncate">{{ book.author }}</p>

    <span class="inline-block mt-2" [class]="statusBadgeClass">{{ book.readingStatus | readingStatus }}</span>

    <div class="mt-2">
      @if (book.rating) {
        <app-star-rating [value]="book.rating" [isReadonly]="true"></app-star-rating>
      } @else {
        <span class="text-xs text-gray-400 italic">Não avaliado</span>
      }
    </div>

    <div class="mt-3 flex justify-end">
      <button mat-icon-button color="warn" aria-label="Remover livro" (click)="onDelete($event)">
        <mat-icon>delete_outline</mat-icon>
      </button>
    </div>
  </div>
</a>
