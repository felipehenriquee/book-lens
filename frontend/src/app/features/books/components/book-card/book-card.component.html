<a
  [routerLink]="['/app/books', book.id]"
  class="group flex flex-col gap-3 no-underline text-ink rounded-xl focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"
>
  <div class="transition-transform duration-200 group-hover:-translate-y-1">
    <app-book-cover [title]="book.title" [author]="book.author" [coverUrl]="book.coverUrl"></app-book-cover>
  </div>

  <div class="flex flex-col gap-1 min-w-0">
    <span class="text-[15px] font-semibold leading-[1.3] line-clamp-2">{{ book.title }}</span>
    <span class="text-[13px] text-muted truncate">{{ book.author }}</span>
    <div class="flex items-center justify-between gap-2 mt-1.5">
      <app-status-badge [status]="book.readingStatus"></app-status-badge>
      @if (stars) {
        <span class="text-[13px] tracking-[1px] text-[#C98500]" [attr.aria-label]="'Avaliação ' + book.rating + ' de 5'">{{ stars }}</span>
      }
    </div>
  </div>
</a>
