<div class="fixed inset-0 flex items-center justify-center p-4" [style.z-index]="zIndex">
  <div class="absolute inset-0 bg-black/50" (click)="closeRequested.emit()"></div>

  <div class="relative w-full bg-white rounded-xl shadow-xl flex flex-col max-h-[90vh]" [class]="sizeClass">
    <header class="flex items-center justify-between px-5 py-4 bg-gray-200 border-b rounded-t-xl flex-shrink-0">
      <h2 class="m-0 self-center text-lg font-semibold text-gray-900 truncate leading-none">{{ title }}</h2>
      <button
        mat-icon-button
        type="button"
        class="!m-0 self-center"
        matTooltip="Fechar"
        (click)="closeRequested.emit()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </header>

    <div class="px-5 py-4 overflow-y-auto flex-1">
      <ng-content></ng-content>
    </div>

    @if (!hideFooter) {
      <footer class="flex justify-end gap-2 px-5 py-4 border-t flex-shrink-0">
        <button mat-button type="button" (click)="cancel.emit()">{{ cancelLabel }}</button>
        <button
          mat-flat-button
          color="primary"
          type="button"
          [disabled]="saveDisabled"
          (click)="save.emit()"
        >
          {{ saveLabel }}
        </button>
      </footer>
    }
  </div>
</div>
