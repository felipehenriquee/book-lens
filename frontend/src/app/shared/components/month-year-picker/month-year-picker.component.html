<div class="grid grid-cols-2 gap-3 max-w-[520px]">
  <label class="flex flex-col gap-1.5 text-[13px] text-ink-2">
    Mês
    <select
      [value]="month() ?? ''"
      [disabled]="disabled"
      (change)="onMonthChange($any($event.target).value ? +$any($event.target).value : null)"
      class="h-12 border border-solid border-line-input rounded-[10px] bg-surface px-3 font-[inherit] text-[15px] text-ink cursor-pointer disabled:opacity-50"
    >
      <option value="">Selecione</option>
      @for (m of months; track m.value) {
        <option [value]="m.value">{{ m.label }}</option>
      }
    </select>
  </label>

  <label class="flex flex-col gap-1.5 text-[13px] text-ink-2">
    Ano
    <select
      [value]="year() ?? ''"
      [disabled]="disabled"
      (change)="onYearChange($any($event.target).value ? +$any($event.target).value : null)"
      class="h-12 border border-solid border-line-input rounded-[10px] bg-surface px-3 font-[inherit] text-[15px] text-ink cursor-pointer disabled:opacity-50"
    >
      <option value="">Selecione</option>
      @for (y of years(); track y) {
        <option [value]="y">{{ y }}</option>
      }
    </select>
  </label>
</div>
