<div class="min-h-screen bg-page text-ink font-sans">
  <header class="bg-surface border-0 border-b border-solid border-line">
    <div class="max-w-[1280px] mx-auto px-6 py-3.5 flex flex-wrap items-center gap-x-7 gap-y-3 box-border">
      <a routerLink="/app/books" class="flex items-center gap-2.5 no-underline text-ink">
        <span class="w-9 h-9 rounded-[10px] bg-ink flex items-center justify-center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"></path><path d="M5 18a2 2 0 0 1 2-2h11"></path></svg>
        </span>
        <span class="font-display font-bold text-[21px] tracking-[-0.02em]">BookLens</span>
      </a>

      <nav aria-label="Principal" class="flex flex-wrap gap-1">
        <a
          routerLink="/app/books"
          routerLinkActive="!bg-primary-soft !text-primary-hover !font-semibold"
          class="px-3.5 py-3 rounded-lg no-underline text-sm font-medium text-ink-2 hover:bg-surface-muted"
        >Biblioteca</a>
        <a
          routerLink="/app/escanear"
          routerLinkActive="!bg-primary-soft !text-primary-hover !font-semibold"
          class="inline-flex items-center gap-2 px-3.5 py-3 rounded-lg no-underline text-sm font-medium text-ink-2 hover:bg-surface-muted"
        >
          Scans
          @if (scanJobs.readyCount() > 0) {
            <span
              class="min-w-5 h-5 px-1.5 rounded-full bg-primary text-white text-[11px] font-bold flex items-center justify-center box-border"
              [attr.aria-label]="scanJobs.readyCount() + ' prontos para revisar'"
            >{{ scanJobs.readyCount() }}</span>
          } @else if (scanJobs.pendingCount() > 0) {
            <span class="w-2 h-2 rounded-full bg-primary animate-pulse" aria-label="Scans em análise"></span>
          }
        </a>
      </nav>

      <div class="flex-[1_1_260px] min-w-[200px] flex items-center gap-2 bg-page border border-solid border-line rounded-[10px] px-3 h-11 box-border focus-within:border-primary">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label for="busca" class="sr-only">Buscar livros</label>
        <input
          id="busca"
          type="search"
          placeholder="Buscar por título, autor ou editora"
          [value]="libraryUi.search()"
          (input)="onSearch($any($event.target).value)"
          class="border-0 bg-transparent outline-none flex-1 min-w-0 font-[inherit] text-sm text-ink"
        />
      </div>

      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="openScan()"
          class="inline-flex items-center gap-2 h-11 px-[18px] rounded-[10px] border-0 bg-primary hover:bg-primary-hover text-white font-[inherit] font-semibold text-sm cursor-pointer"
        >
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          Escanear livros
        </button>
        <button
          type="button"
          (click)="openManual()"
          class="inline-flex items-center justify-center gap-2 h-11 px-4 rounded-[10px] border border-solid border-line-input bg-surface hover:bg-surface-muted text-ink font-[inherit] font-semibold text-sm cursor-pointer"
        >
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          Manual
        </button>
        <button
          type="button"
          (click)="logout()"
          aria-label="Sair"
          title="Sair"
          class="inline-flex items-center justify-center w-11 h-11 rounded-[10px] border border-solid border-line-input bg-surface hover:bg-surface-muted cursor-pointer"
        >
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4F59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-[1280px] mx-auto px-6 pt-10 pb-[72px] box-border">
    <router-outlet></router-outlet>
  </main>
</div>
